name: Release

# This workflow publishes the crate to crates.io. It uses trusted publishing,
# so the repository holds no crates.io token. The action asks GitHub for an
# OIDC token, then exchanges that token at crates.io for a token with a short
# life. The action revokes that token when the job stops.
#
# crates.io must know this file. Add a trusted publisher at
# https://crates.io/crates/mac-encoding/settings with these values:
#
#   Publisher          GitHub
#   Repository owner   codybrom
#   Repository name    mac-encoding
#   Workflow filename  release.yml
#   Environment name   crates-io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # The environment holds the protection rules for a release. crates.io
    # also compares this name with the trusted publisher.
    environment: crates-io
    permissions:
      # The action needs this permission to get the OIDC token.
      id-token: write
      # The last step needs this permission to make the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A tag that does not agree with Cargo.toml gives the wrong version on
      # crates.io. An upload is permanent, so stop before the upload.
      - name: Check that the tag agrees with Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The workspace has two packages, so select the crate by name.
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mac-encoding") | .version')"
          if [ "$tag" != "$version" ]; then
            echo "the tag $GITHUB_REF_NAME does not agree with the version $version" >&2
            exit 1
          fi
          echo "the tag and Cargo.toml both give $version"

      # The repository does not contain Apple's mapping files. Without them,
      # the comparison tests write a notice and stop.
      - name: Download the mapping files
        run: ./scripts/fetch-sources.sh

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Test the documentation
        run: cargo test --doc

      - name: Get a token from crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # The notes come from the entry for this version in CHANGELOG.md. This
      # step comes after the upload, so a failed upload makes no release.
      - name: Make the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && /^\[[^]]+\]:/ { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
          echo "Published at <https://crates.io/crates/mac-encoding/$version>." >> notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "mac-encoding $version" \
            --notes-file notes.md
